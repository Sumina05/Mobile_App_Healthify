name: healthify_mobile
description: "Healthify — AI-powered skincare & cosmetic ingredient analysis."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.0+2
  clock: ^1.1.2
  connectivity_plus: ^7.3.0
  device_info_plus: ^13.2.0
  dio: ^5.10.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  google_mlkit_barcode_scanning: ^0.15.0
  google_mlkit_text_recognition: ^0.16.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  local_auth: ^3.0.2
  package_info_plus: ^10.2.1
  share_plus: ^13.2.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
